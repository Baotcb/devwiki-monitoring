route:
  receiver: "discord-webhook"
  group_wait: 10s
  group_interval: 5m
  repeat_interval: 3h

receivers:
  - name: "discord-webhook"
    discord_configs:
      - webhook_url: "https://discord.com/api/webhooks/1549278121184862338/UJzAAxNng97TLwIcGqs_4CvHrEEQ7_KbTi92baA-J2zj_ZcCa5wvFY3ADzSGARq2_TO6"
        send_resolved: true
        title: "[{{ .Status | toUpper }}] {{ .GroupLabels.alertname }}"
        message: >-
          {{ range .Alerts }}
            *Mô tả:* {{ .Annotations.description }}
            *Mức độ:* {{ .Labels.severity }}
          {{ end }}
