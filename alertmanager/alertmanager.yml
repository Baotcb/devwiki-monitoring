      - webhook_url: "https://webhook.mezon.ai/webhooks/2095396828265582592/MTc4OTQ1NDIwNjU3OTg5NzE0OToyMDk1Mzk2Nzg2MTI5NjA0NjA4OjIwOTUzOTY4MjgyNjU1ODI1OTI6MjA5OTc0OTI0NTQ0Njc4NzA3Mg.UI9JS9rDeoeRUEZW87KdGtVW6TBqSXr873y1P1nDTKY"
        send_resolved: true
        title: "[{{ .Status | toUpper }}] {{ .GroupLabels.alertname }}"
        message: >-
          {{ range .Alerts }}
            *Mô tả:* {{ .Annotations.description }}
            *Mức độ:* {{ .Labels.severity }}
          {{ end }}
