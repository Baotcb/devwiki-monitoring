route:
  receiver: "mezon-webhook"
  group_wait: 10s
  group_interval: 5m
  repeat_interval: 3h

receivers:
  - name: "mezon-webhook"
    slack_configs:
      # - api_url: "https://webhook.mezon.ai/webhooks/2095396828265582592/MTc4ODQxNjUyMzA5NDE2NTQ4ODoyMDk1Mzk2Nzg2MTI5NjA0NjA4OjIwOTUzOTY4MjgyNjU1ODI1OTI6MjA5NTM5Njg4NTE5NDg3MDc4NA.w7F1OOY5kdc-LHBfwSbmKhEcOCwIvSf_Am6u14EF81U/slack"
      - api_url: "https://discord.com/api/webhooks/1549278121184862338/UJzAAxNng97TLwIcGqs_4CvHrEEQ7_KbTi92baA-J2zj_ZcCa5wvFY3ADzSGARq2_TO6/slack"
        send_resolved: true
        title: "[{{ .Status | toUpper }}] {{ .GroupLabels.alertname }}"
        text: >-
          {{ range .Alerts }}
            *Mô tả:* {{ .Annotations.description }}
            *Mức độ:* {{ .Labels.severity }}
          {{ end }}
